services:
  cli-proxy-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-local}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: ${CLI_PROXY_IMAGE:-cli-proxy-api:local}
    container_name: cli-proxy-api
    environment:
      DEPLOY: ${DEPLOY:-docker-compose}
      TZ: ${TZ:-Asia/Shanghai}
      CPA_MANAGER_PLUS_URL: http://127.0.0.1:18317
      CPA_MANAGER_INTEGRATED: "true"
      HTTP_ADDR: 127.0.0.1:18317
      CPA_UPSTREAM_URL: http://127.0.0.1:8317
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:?set CPA_MANAGEMENT_KEY in .env.stack}
      USAGE_DATA_DIR: /data
      USAGE_DB_PATH: /data/usage.sqlite
      CLIENT_ACCESS_ENABLED: "true"
      CLIENT_ACCESS_DB_PATH: /data/client-access.sqlite
      CLIENT_ACCESS_TOKEN_RESERVATION: ${CLIENT_ACCESS_TOKEN_RESERVATION:-1024}
      CPA_MANAGER_DATA_KEY_PATH: /data/data.key
      USAGE_COLLECTOR_MODE: ${USAGE_COLLECTOR_MODE:-auto}
      USAGE_RESP_QUEUE: ${USAGE_RESP_QUEUE:-usage}
      USAGE_RESP_POP_SIDE: ${USAGE_RESP_POP_SIDE:-right}
      USAGE_BATCH_SIZE: ${USAGE_BATCH_SIZE:-100}
      USAGE_POLL_INTERVAL_MS: ${USAGE_POLL_INTERVAL_MS:-500}
      USAGE_QUERY_LIMIT: ${USAGE_QUERY_LIMIT:-50000}
      USAGE_CORS_ORIGINS: ${USAGE_CORS_ORIGINS:-*}
      USAGE_QUOTA_COOLDOWN_ENABLED: ${USAGE_QUOTA_COOLDOWN_ENABLED:-true}
      USAGE_ACCOUNT_ACTIONS_ENABLED: ${USAGE_ACCOUNT_ACTIONS_ENABLED:-true}
      USAGE_ACCOUNT_ACTIONS_AUTO_DISABLE: ${USAGE_ACCOUNT_ACTIONS_AUTO_DISABLE:-false}
      USAGE_DASHBOARD_HOURLY_ROLLUP_ENABLED: ${USAGE_DASHBOARD_HOURLY_ROLLUP_ENABLED:-true}
    expose:
      - "8317"
    ports:
      - "${CLI_PROXY_PORT:-8317}:8317"
      - "${GEMINI_CALLBACK_PORT:-8085}:8085"
      - "${CODEX_CALLBACK_PORT:-1455}:1455"
      - "${ANTHROPIC_CALLBACK_PORT:-54545}:54545"
      - "${KIMI_CALLBACK_PORT:-51121}:51121"
      - "${XAI_CALLBACK_PORT:-11451}:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml:rw
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api:rw
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs:rw
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins:rw
      - ${CPA_MANAGER_DATA_PATH:-./data/cpa-manager-plus}:/data:rw
    restart: unless-stopped
    networks:
      - cpa_bridge

  nginx-proxy:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        VERSION: ${CPA_MANAGER_VERSION:-local}
    image: ${NGINX_PROXY_IMAGE:-cpa-nginx-proxy:local}
    container_name: nginx-proxy
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.example.com}
      MANAGER_DOMAIN: ${MANAGER_DOMAIN:-manager.example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${API_SSL_CERT:?set API_SSL_CERT in .env.stack}:/etc/nginx/certs/api.pem:ro
      - ${API_SSL_KEY:?set API_SSL_KEY in .env.stack}:/etc/nginx/certs/api.key:ro
      - ${MANAGER_SSL_CERT:?set MANAGER_SSL_CERT in .env.stack}:/etc/nginx/certs/manager.pem:ro
      - ${MANAGER_SSL_KEY:?set MANAGER_SSL_KEY in .env.stack}:/etc/nginx/certs/manager.key:ro
    depends_on:
      cli-proxy-api:
        condition: service_started
    restart: unless-stopped
    networks:
      - cpa_bridge

networks:
  cpa_bridge:
    name: ${CPA_DOCKER_NETWORK:-cpa-bridge}
